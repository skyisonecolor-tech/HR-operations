function unitStatusSheet(){
  const aoa = [['학교급','학교','최종 예정표','교과 수','일치','미해결','통과','현원 총계(배당표)','현원 총계(예정표)','기준정원 총계(배당표)','기준정원 총계(예정표)','증감 총계(배당표)','증감 총계(예정표)','배당표 검산 확인']];
  unitNames().forEach(n => { const C = unitCompare(n), T = C.tot, ck = unitChecks(C.U).filter(c => !c.ok);
    aoa.push([LEVELS[unitLevel(n)], n, C.rec ? 'O' : '없음', C.rows.length, C.cnt.ok, C.rec ? C.unresolved : '', C.cnt.pass, T.uA, C.rec ? T.pA : '', T.uB, C.rec ? T.pB : '', T.uD, C.rec ? T.pD : '', ck.map(c => c.text).join(' / ')]); });
  if (aoa.length === 1) aoa.push(['', '(배당표 없음)']);
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:8},{wch:20},{wch:10},...Array(10).fill({wch:10}),{wch:60}]; return ws;
}
function unitDetailSheet(names){
  const aoa = [['학교','교과','현원(배당표)','현원(예정표)','기준정원(배당표)','기준정원(예정표)','증감(배당표)','증감(예정표 과부족)','상태','사유']];
  names.forEach(n => { const C = unitCompare(n);
    C.rows.forEach(r => aoa.push([n, r.label, r.u ? nz(r.u.A) : '', r.p ? r.p.A : '', r.u ? nz(r.u.B) : '', r.p ? r.p.B : '', r.u ? nz(r.u.D) : '', r.p ? r.p.D : '', C.rec ? UST[r.st] : '예정표 없음', r.rv ? r.rv.reason || '' : ''])); });
  if (aoa.length === 1) aoa.push(['(자료 없음)']);
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:20},{wch:14},...Array(6).fill({wch:10}),{wch:10},{wch:50}]; return ws;
}
function unitSheet(name){
  const U = state.units[name], T = U.totals;
  const aoa = [[`${name} — 기준년도 교육과정편제 및 단위시간 배당표`], [`${U.office || ''} / 원본: ${U.fileName}`], [], ['정원(임용)과목','시수(학점)총계','계산교원수','현원(A)','기준년도 정원(B)','증감(A-B)'],
    ...U.summary.map(r => [r.subj, r.hours ?? '', r.calc ?? '', r.A ?? '', r.B ?? '', r.D ?? '']), ['총계', T.hours ?? '', `평균시수 ${T.avg ?? ''}`, T.A ?? '', T.B ?? '', T.D ?? ''], [], ['[과목별 편제]'],
    ['순번','과목','수업교사 정원(임용)과목','학년','수업학기','주당시수','학급수','연환산 주당시수(학점)계'], ...U.courses.map(c => [c.no, c.name, c.tsub, c.grade ?? '', c.sem ?? '', c.hrs ?? '', c.cls ?? '', c.annual ?? ''])];
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:16},{wch:26},{wch:18},{wch:8},{wch:10},{wch:10},{wch:8},{wch:12}]; return ws;
}
function unitDocHtml(name){
  const U = state.units[name], T = U.totals, fN = v => v == null ? '' : Math.round(v * 100) / 100;
  return `<div class="fdoc"><div class="fd-head"><div class="fd-k">기준년도 교육과정편제 및 단위시간 배당표</div><div class="fd-t">${esc(name)}</div><div class="fd-m">${esc(U.office || '')} · 원본 ${esc(U.fileName)}</div></div>
    <table class="fd-tb"><thead><tr><th>정원(임용)과목</th><th>시수(학점)총계</th><th>계산교원수</th><th>현원(A)</th><th>기준년도 정원(B)</th><th>증감(A-B)</th></tr></thead>
    <tbody>${U.summary.map(r => `<tr><td class="c">${esc(r.subj)}</td><td class="c">${fN(r.hours)}</td><td class="c">${fN(r.calc)}</td><td class="c">${fN(r.A)}</td><td class="c">${fN(r.B)}</td><td class="c">${fN(r.D)}</td></tr>`).join('')}
    <tr><td class="c it">총계</td><td class="c it">${fN(T.hours)}</td><td class="c it">평균 ${fN(T.avg)}</td><td class="c it">${fN(T.A)}</td><td class="c it">${fN(T.B)}</td><td class="c it">${fN(T.D)}</td></tr></tbody></table>
    <div class="fd-foot">교원조직 예정표 비교·검증</div></div>`;
}
async function unitUpload(files){
  const log = [];
  for (const f of [...files].filter(f => /\.(xlsx|xls)$/i.test(f.name))){
    try { const U = await parseUnit(f), ex = !!state.units[U.school]; state.units[U.school] = U; ui.unitSel = U.school;
      log.push(`✔ ${f.name} → ${U.school} (${ex ? '교체' : '신규'}, 교과 ${U.summary.length} · 과목 ${U.courses.length})`); }
    catch(err){ log.push(`✖ ${f.name} → ${err.message}`); }
  }
  persist(); renderUnit();
  if (log.length) toast(`<b>배당표 올리기</b><ul>${log.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, { err:log.some(x => x[0] === '✖'), sticky:log.length > 3 || log.some(x => x[0] === '✖') });
}
$('#unitInput').addEventListener('change', e => { const fs = e.target.files; if (fs && fs.length) unitUpload([...fs]); e.target.value = ''; });
FULL.addEventListener('click', e => {
  if (ui.tab !== 'unit') return;
  const t = e.target, b = t.closest('button, tr[data-ufilter], tr[data-urow], tr[data-ugo]'); if (!b) return;
  const name = ui.unitSel, stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`; };
  if (b.id === 'unitUp') return $('#unitInput').click();
  if (b.dataset.unit){ ui.unitSel = b.dataset.unit; ui.unitRow = null; ui.unitFilter = null; if (ui.unitSub === 'all') ui.unitSub = 'cmp'; renderUnit(); return; }
  if (b.dataset.usub){ ui.unitSub = b.dataset.usub; renderUnit(); return; }
  if (b.dataset.ugo){ ui.unitSel = b.dataset.ugo; ui.unitSub = 'cmp'; ui.unitRow = null; renderUnit(); return; }
  if (b.dataset.ufilter != null){ ui.unitFilter = b.dataset.ufilter && b.dataset.ufilter !== ui.unitFilter ? b.dataset.ufilter : null; renderUnit(); return; }
  if (b.dataset.urow){ ui.unitRow = b.dataset.urow; renderUnit(); return; }
  if (b.id === 'unitExBtn'){ ui.unitExOpen = !ui.unitExOpen; renderUnit(); return; }
  if (b.id === 'unitAllXlsx'){ const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, unitStatusSheet(), '대조 현황'); XLSX.utils.book_append_sheet(wb, unitDetailSheet(unitNames()), '대조 상세'); saveBook(wb, `단위시간배당표_대조_전체_${stamp()}.xlsx`); return; }
  if (!name) return;
  if (b.id === 'unitXlsx'){ const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, unitSheet(name), '배당표 정리'); saveBook(wb, safeName(`단위시간배당표_${name}_${stamp()}.xlsx`)); return; }
  if (b.id === 'unitCmpXlsx'){ const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, unitDetailSheet([name]), '대조'); saveBook(wb, safeName(`배당표대조_${name}_${stamp()}.xlsx`)); return; }
  if (b.id === 'unitPrint'){ const old = $('#batchPrint'); if (old) old.remove(); const box = document.createElement('div'); box.id = 'batchPrint'; box.className = 'portrait';
    box.innerHTML = `<div class="bpage">${unitDocHtml(name)}</div>`; document.body.appendChild(box); document.body.classList.add('batch-print');
    setTimeout(() => { window.print(); setTimeout(() => { box.remove(); document.body.classList.remove('batch-print'); }, 300); }, 50); return; }
  if (b.id === 'unitDel'){ if (!confirm(`${name} 배당표를 삭제할까요? (적어 둔 사유는 남습니다)`)) return; delete state.units[name]; ui.unitSel = null; persist(); renderUnit(); return; }
  if (b.id === 'uSave' || b.id === 'uDel' || b.id === 'uToFix'){
    const C = unitCompare(name), r = C.rows.find(x => x.k === ui.unitRow); if (!r) return;
    const key = name + '|' + r.k;
    if (b.id === 'uDel'){ if (!confirm('이 교과의 사유를 삭제할까요?')) return; delete state.unitReviews[key]; }
    else if (b.id === 'uSave'){ const reason = $('#uReason').value.trim(), checked = $('#uCheck').checked;
      if (checked && !reason){ alert('사유를 입력해야 통과 처리됩니다.'); return; }
      state.unitReviews[key] = { reason, checked, snap:r.snap, updatedAt:new Date().toISOString() }; }
    else { if (!C.ek) return;
      const u = r.u, p = r.p, part = (lb, a, c) => a == null || c == null ? '' : (a === c ? '' : `${lb} 배당표 ${a} / 예정표 ${c}`);
      const txt = r.st === 'onlyP' ? `배당표에 없음 (예정표 현원 ${p.A}, 기준정원 ${p.B}, 증감 ${p.D})`
        : r.st === 'onlyU' ? `예정표에 없음 (배당표 현원 ${nz(u.A)}, 기준정원 ${nz(u.B)}, 증감 ${nz(u.D)})`
        : [part('현원', u && nz(u.A), p && p.A), part('기준정원', u && nz(u.B), p && p.B), part('증감', u && nz(u.D), p && p.D)].filter(Boolean).join(', ') || UST[r.st];
      (state.fixes[C.ek] = state.fixes[C.ek] || []).push({ id:uid(), item:`단위시간 배당표 대조 · ${r.label}`, text:txt, createdAt:new Date().toISOString() });
      toast(`<b>학교별 수정사항에 추가했습니다.</b><br>${esc(r.label)}: ${esc(txt)}`); }
    persist(); renderUnit(); return;
  }
});
FULL.addEventListener('change', e => {
  if (ui.tab !== 'unit') return;
  const t = e.target;
  if (t.dataset.ulink != null){ state.unitLink[t.dataset.ulink] = t.value; persist(); renderUnit(); return; }
  if (t.dataset.uex != null){ const s = t.dataset.uex, ex = new Set(state.unitExclude || []); if (t.checked) ex.add(s); else ex.delete(s); state.unitExclude = [...ex]; persist(); renderUnit(); }
});
FULL.addEventListener('input', e => {
  if (ui.tab !== 'unit' || e.target.id !== 'unitQ') return;
  const pos = e.target.selectionStart; ui.unitQ = e.target.value;
  clearTimeout(fixTimer); setTimeout(() => { renderUnit(); const n = $('#unitQ'); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }, 200);
});
// 배당표 탭에서는 끌어다 놓아도 올라가게
FULL.addEventListener('dragover', e => { if (ui.tab === 'unit') e.preventDefault(); });
FULL.addEventListener('drop', e => { if (ui.tab !== 'unit') return; e.preventDefault(); if (e.dataTransfer.files.length) unitUpload([...e.dataTransfer.files]); });

/* ===================== 비교 재실행 · 알림 · 실시간 동기화 ===================== */
let toastTimer = null;
function toast(html, opt = {}){
  const t = $('#toast'); clearTimeout(toastTimer);
  t.className = opt.err ? 'err' : ''; t.innerHTML = `<button class="x" aria-label="닫기">×</button>${html}`; t.hidden = false;
  if (!opt.sticky) toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}
$('#toast').addEventListener('click', e => { if (e.target.closest('.x')) $('#toast').hidden = true; });

function rerender(){ if (ui.mode === 'settings') renderSettings(); else renderView(); }
function rerunCompare(){
  const btn = $('#rerunBtn'); btn.classList.add('busy'); btn.textContent = '↻ 비교 중…';
  setTimeout(() => {
    const errs = []; let fixed = 0;
    // 1) 저장된 자료 점검·정리 (사유·비고·메모는 건드리지 않음)
    for (const g of VIEW_ORDER){
      for (const [key, rec] of Object.entries(state.groups[g].files)){
        try {
          if (!Array.isArray(rec.subjects) || !Array.isArray(rec.rows)) throw new Error('자료 구조 손상 — 파일을 다시 올려 주세요');
          rec.rows.forEach(r => { r.values = rec.subjects.map((_, i) => { const v = toVal(r.values[i]); if (v !== r.values[i]) fixed++; return v; }); });
          if (rec.kind === 'SCHOOL' && !state.schoolMeta[rec.origName]) state.schoolMeta[rec.origName] = { display:'', level:inferLevel(rec.origName) };
        } catch(err){ errs.push(`[${GROUPS[g].label}] ${rec.fileName || key}: ${err.message}`); }
      }
    }
    // 2) 캐시 비우고 모든 비교를 처음부터 다시 계산
    invalidate();
    const sum = { ent:0, both:0, diff:0, un:0, pass:0 };
    for (const e of allEntities()){
      sum.ent++;
      try {
        const m = cmpModel(e.sel, false);
        if (!m.missing){ sum.both++; sum.diff += m.cnt.diff + m.cnt.stale + m.cnt.pass; sum.un += m.cnt.diff + m.cnt.stale; sum.pass += m.cnt.pass; }
        classRow(e);
      } catch(err){ errs.push(`${e.name}: ${err.message}`); }
    }
    persist(); rerender();
    btn.classList.remove('busy'); btn.textContent = '↻ 비교 재실행';
    const msg = `<b>비교 재실행 완료</b><br>대상 ${sum.ent}곳 (9월·최종 모두 있음 ${sum.both}곳) · 차이 ${sum.diff}칸 · 미해결 ${sum.un} · 통과 ${sum.pass}${fixed ? `<br>숫자 형식 정리 ${fixed}칸` : ''}<br><span style="color:#9ca3af">사유·비고·메모는 그대로 유지됩니다.</span>`;
    if (errs.length) toast(msg + `<br><b>오류 ${errs.length}건</b><ul>${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, { err:true, sticky:true });
    else toast(msg);
  }, 30);
}
$('#rerunBtn').addEventListener('click', rerunCompare);

// 같은 컴퓨터에서 이 페이지를 여러 창(탭)으로 열어 둔 경우 실시간 동기화
let pendingSync = false;
const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'file'; };
window.addEventListener('storage', e => {
  if (e.key !== LS_KEY || !e.newValue) return;
  try { const o = JSON.parse(e.newValue); if (!validState(o)) return; state = normalize(o); invalidate(); }
  catch(err){ return; }
  setSaveState('다른 창의 변경 사항 반영 · ' + fmtTime(state.updatedAt).slice(11));
  if (typing()) pendingSync = true; else rerender();
});
document.addEventListener('focusout', () => { if (pendingSync) setTimeout(() => { if (pendingSync && !typing()){ pendingSync = false; rerender(); } }, 50); });

window.addEventListener('error', e => {
  toast(`<b>처리 중 오류가 발생했습니다.</b><br>${esc(e.message || '')}<br>‘↻ 비교 재실행’을 눌러 보세요. 작업한 사유·비고·메모는 유지됩니다.`, { err:true, sticky:true });
});

/* ===================== 시작 ===================== */
loadLocal();
ensureSelection();
renderView();
</script>

</html>
